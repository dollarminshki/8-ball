<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Pool Billiards</title>
    <!-- Tailwind CSS for modern UI styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js for 3D rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { margin: 0; overflow: hidden; background-color: #0f172a; font-family: 'Inter', sans-serif; user-select: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
        .glass-panel { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="text-white">

    <!-- UI Overlay -->
    <div id="ui-container" class="absolute top-0 left-0 w-full p-6 flex justify-between items-start pointer-events-none z-10">
        <!-- Game Stats -->
        <div class="glass-panel p-4 rounded-2xl shadow-2xl pointer-events-auto flex items-center space-x-6">
            <div>
                <h1 class="text-xl font-bold tracking-wider text-cyan-400 flex items-center gap-2">
                    <i class="fa-solid fa-circle-dot"></i> 3D BILLIARDS
                </h1>
                <p class="text-xs text-slate-400 mt-1">Midnight Electric Edition</p>
            </div>
            <div class="h-8 w-px bg-slate-700"></div>
            <div>
                <div class="text-xs uppercase tracking-wider text-slate-400">Score</div>
                <div id="score-val" class="text-2xl font-black text-cyan-300">0</div>
            </div>
            <div>
                <div class="text-xs uppercase tracking-wider text-slate-400">Balls Sunk</div>
                <div id="sunk-val" class="text-2xl font-black text-emerald-400">0 / 15</div>
            </div>
        </div>

        <!-- Controls Guide & Buttons -->
        <div class="flex flex-col items-end gap-3 pointer-events-auto">
            <div class="glass-panel p-4 rounded-2xl shadow-2xl text-xs space-y-1.5 text-slate-300 w-64">
                <div class="font-bold text-cyan-300 mb-1 flex items-center justify-between">
                    <span>CONTROLS</span>
                    <i class="fa-solid fa-gamepad"></i>
                </div>
                <div><b class="text-white">Left Click + Drag:</b> Rotate Camera</div>
                <div><b class="text-white">A / D or Arrows:</b> Aim Cue Stick</div>
                <div><b class="text-white">Hold SPACE:</b> Charge Shot Power</div>
                <div><b class="text-white">Release SPACE:</b> Strike Ball</div>
                <div><b class="text-white">R Key:</b> Reset Cue Ball if Sunk</div>
            </div>
            <button id="reset-btn" class="glass-panel px-5 py-2.5 rounded-xl font-bold text-cyan-400 hover:bg-cyan-500 hover:text-white transition shadow-lg flex items-center gap-2 text-sm">
                <i class="fa-solid fa-rotate-right"></i> Reset Table
            </button>
        </div>
    </div>

    <!-- Power Bar Overlay -->
    <div id="power-container" class="absolute bottom-8 left-1/2 transform -translate-x-1/2 w-80 glass-panel p-4 rounded-2xl shadow-2xl pointer-events-none opacity-0 transition-opacity duration-200 z-10 flex flex-col items-center">
        <div class="text-xs font-bold text-cyan-300 mb-2 tracking-wider flex justify-between w-full">
            <span>SHOT POWER</span>
            <span id="power-val">0%</span>
        </div>
        <div class="w-full bg-slate-800 h-3 rounded-full overflow-hidden border border-slate-700">
            <div id="power-bar" class="h-full bg-gradient-to-r from-cyan-500 via-blue-500 to-indigo-500 w-0 transition-all duration-75"></div>
        </div>
    </div>

    <!-- Notification Message Box -->
    <div id="message-box" class="absolute top-1/3 left-1/2 transform -translate-x-1/2 -translate-y-1/2 glass-panel px-8 py-4 rounded-2xl shadow-2xl text-center pointer-events-none transition-all duration-300 opacity-0 scale-95 z-20">
        <h2 id="msg-title" class="text-2xl font-black text-cyan-400">NOTIFICATION</h2>
        <p id="msg-text" class="text-sm text-slate-300 mt-1">Message description goes here.</p>
    </div>

    <script>
        /* ==========================================================================
           MODULAR CODE STRUCTURE & OBJ MODEL INTEGRATION GUIDE
           ==========================================================================
           To replace the procedural Three.js table with your custom 3D OBJ model from GitHub:
           1. Include Three.js OBJLoader CDN in the <head>:
              <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/loaders/OBJLoader.js"><\/script>
           2. In the `initTable()` function below, comment out or remove the procedural table creation code.
           3. Use OBJLoader to load your model:
              const loader = new THREE.OBJLoader();
              loader.load('https://raw.githubusercontent.com/YOUR_USERNAME/YOUR_REPO/main/path/to/table.obj', (object) => {
                  object.scale.set(0.1, 0.1, 0.1); // Adjust scale as needed
                  object.position.set(0, -0.5, 0);
                  scene.add(object);
              });
           ========================================================================== */

        // Game State Variables
        let scene, camera, renderer;
        let balls = [];
        let cueBall;
        let cueStick;
        let table;
        let pockets = [];
        
        let isAiming = false;
        let isCharging = false;
        let power = 0;
        let maxPower = 40;
        let aimAngle = 0;

        let score = 0;
        let sunkCount = 0;
        let gameActive = true;

        // Camera control rotation variables
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let cameraAngleX = 0;
        let cameraAngleY = 0.6;
        let cameraDistance = 24;

        // Table Constants
        const TABLE_WIDTH = 10;
        const TABLE_LENGTH = 20;
        const BALL_RADIUS = 0.45;
        const FRICTION = 0.985;
        const CUSHION_RESTITUTION = 0.8;
        const BALL_RESTITUTION = 0.95;

        // Ball colors definition (1 to 15)
        const ballColors = [
            0xffffff, // Cue ball
            0xeab308, 0x2563eb, 0xdc2626, 0x7c3aed, // 1-4
            0xe879f9, 0x059669, 0x991b1b, 0x1e293b, // 5-8 (8 is black)
            0xfacc15, 0x3b82f6, 0xef4444, 0x8b5cf6, // 9-12
            0xf472b6, 0x10b981, 0xb91c1c  // 13-15
        ];

        function init() {
            // Scene Setup
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0f172a, 0.015);

            // Camera Setup
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            updateCameraPosition();

            // Renderer Setup
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const mainLight = new THREE.DirectionalLight(0xe0f2fe, 1.2);
            mainLight.position.set(0, 18, 5);
            mainLight.castShadow = true;
            mainLight.shadow.mapSize.width = 2048;
            mainLight.shadow.mapSize.height = 2048;
            mainLight.shadow.camera.near = 0.5;
            mainLight.shadow.camera.far = 40;
            mainLight.shadow.camera.left = -8;
            mainLight.shadow.camera.right = 8;
            mainLight.shadow.camera.top = 12;
            mainLight.shadow.camera.bottom = -12;
            scene.add(mainLight);

            // Colored rim accent lights for electric vibe
            const blueLight = new THREE.PointLight(0x00f2fe, 2, 20);
            blueLight.position.set(-6, 2, -12);
            scene.add(blueLight);

            const purpleLight = new THREE.PointLight(0x4facfe, 2, 20);
            purpleLight.position.set(6, 2, 12);
            scene.add(purpleLight);

            // Build Environment & Table
            initTable();
            initBalls();
            initCueStick();

            // Event Listeners
            window.addEventListener('resize', onWindowResize, false);
            setupInputListeners();

            // Start Game Loop
            animate();
            showNotification("BREAK SHOT", "Hold SPACE to power up and release to strike!");
        }

        /* Table Construction (Procedural - Replaceable with OBJ model here) */
        function initTable() {
            table = new THREE.Group();

            // Playing Surface (Felt)
            const feltGeometry = new THREE.BoxGeometry(TABLE_WIDTH, 0.4, TABLE_LENGTH);
            const feltMaterial = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.9 });
            const felt = new THREE.Mesh(feltGeometry, feltMaterial);
            felt.position.y = -0.2;
            felt.receiveShadow = true;
            table.add(felt);

            // Cushions/Rails with Midnight/Electric Blue aesthetic
            const railMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.3, roughness: 0.4 });
            const neonMat = new THREE.MeshBasicMaterial({ color: 0x00f2fe });

            // Rails dimensions
            const longRailGeo = new THREE.BoxGeometry(0.8, 0.8, TABLE_LENGTH + 1.6);
            const shortRailGeo = new THREE.BoxGeometry(TABLE_WIDTH + 1.6, 0.8, 0.8);

            const railLeft = new THREE.Mesh(longRailGeo, railMat);
            railLeft.position.set(-TABLE_WIDTH/2 - 0.4, 0.2, 0);
            railLeft.castShadow = true; railLeft.receiveShadow = true;
            table.add(railLeft);

            const railRight = new THREE.Mesh(longRailGeo, railMat);
            railRight.position.set(TABLE_WIDTH/2 + 0.4, 0.2, 0);
            railRight.castShadow = true; railRight.receiveShadow = true;
            table.add(railRight);

            const railTop = new THREE.Mesh(shortRailGeo, railMat);
            railTop.position.set(0, 0.2, -TABLE_LENGTH/2 - 0.4);
            railTop.castShadow = true; railTop.receiveShadow = true;
            table.add(railTop);

            const railBottom = new THREE.Mesh(shortRailGeo, railMat);
            railBottom.position.set(0, 0.2, TABLE_LENGTH/2 + 0.4);
            railBottom.castShadow = true; railBottom.receiveShadow = true;
            table.add(railBottom);

            // Electric Blue Neon Insets along rails
            const neonGeo1 = new THREE.BoxGeometry(0.05, 0.1, TABLE_LENGTH);
            const neonLeft = new THREE.Mesh(neonGeo1, neonMat);
            neonLeft.position.set(-TABLE_WIDTH/2 - 0.05, 0.5, 0);
            table.add(neonLeft);

            const neonRight = new THREE.Mesh(neonGeo1, neonMat);
            neonRight.position.set(TABLE_WIDTH/2 + 0.05, 0.5, 0);
            table.add(neonRight);

            // Table Legs
            const legGeo = new THREE.CylinderGeometry(0.4, 0.3, 5, 16);
            const legMat = new THREE.MeshStandardMaterial({ color: 0x090d16, metalness: 0.5, roughness: 0.2 });
            
            [-TABLE_WIDTH/2 + 0.6, TABLE_WIDTH/2 - 0.6].forEach(x => {
                [-TABLE_LENGTH/2 + 1, TABLE_LENGTH/2 - 1].forEach(z => {
                    const leg = new THREE.Mesh(legGeo, legMat);
                    leg.position.set(x, -2.7, z);
                    leg.castShadow = true;
                    table.add(leg);
                });
            });

            // Define Pocket Coordinates (6 Pockets)
            const halfW = TABLE_WIDTH / 2;
            const halfL = TABLE_LENGTH / 2;
            const pRadius = 0.65;
            
            const pocketPositions = [
                { x: -halfW, z: -halfL }, // Top-Left
                { x: halfW, z: -halfL },  // Top-Right
                { x: -halfW, z: 0 },      // Side-Left
                { x: halfW, z: 0 },       // Side-Right
                { x: -halfW, z: halfL },  // Bottom-Left
                { x: halfW, z: halfL }    // Bottom-Right
            ];

            pocketPositions.forEach(pos => {
                pockets.push({ x: pos.x, z: pos.z, radius: pRadius });
                
                // Visual pocket hole ring
                const pocketGeo = new THREE.RingGeometry(0.1, pRadius, 24);
                const pocketMat = new THREE.MeshBasicMaterial({ color: 0x020617, side: THREE.DoubleSide });
                const pocketMesh = new THREE.Mesh(pocketGeo, pocketMat);
                pocketMesh.rotation.x = -Math.PI / 2;
                pocketMesh.position.set(pos.x, 0.01, pos.z);
                table.add(pocketMesh);
            });

            scene.add(table);
        }

        /* Initialize Billiard Balls in Standard Triangle Rack */
        function initBalls() {
            // Cue Ball (Index 0)
            cueBall = createBall(0, 0, 4);
            balls.push(cueBall);

            // Racking 15 balls in a triangle at z = -4
            let startX = 0;
            let startZ = -4;
            let row = 1;
            let ballIndex = 1;

            while (row <= 5) {
                let currentX = startX - (row - 1) * BALL_RADIUS * 1.02;
                for (let i = 0; i < row; i++) {
                    if (ballIndex <= 15) {
                        const b = createBall(currentX, 0, startZ, ballIndex);
                        balls.push(b);
                        ballIndex++;
                        currentX += BALL_RADIUS * 2.04;
                    }
                }
                startZ -= BALL_RADIUS * 1.76;
                row++;
            }
        }

        function createBall(x, y, z, id = 0) {
            const geometry = new THREE.SphereGeometry(BALL_RADIUS, 32, 32);
            const material = new THREE.MeshStandardMaterial({
                color: ballColors[id],
                roughness: 0.15,
                metalness: 0.1
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            scene.add(mesh);

            return {
                mesh: mesh,
                velocity: new THREE.Vector3(0, 0, 0),
                radius: BALL_RADIUS,
                id: id,
                sunk: false
            };
        }

        /* Create Cue Stick */
        function initCueStick() {
            const cueGeo = new THREE.CylinderGeometry(0.06, 0.12, 12, 16);
            cueGeo.rotateX(Math.PI / 2);
            const cueMat = new THREE.MeshStandardMaterial({ color: 0x78350f, roughness: 0.4 });
            cueStick = new THREE.Mesh(cueGeo, cueMat);
            cueStick.castShadow = true;
            cueStick.visible = true;
            scene.add(cueStick);
        }

        /* Event Handlers Setup */
        function setupInputListeners() {
            window.addEventListener('mousedown', (e) => {
                isDragging = true;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;

                cameraAngleX -= deltaX * 0.008;
                cameraAngleY = Math.max(0.1, Math.min(Math.PI / 2 - 0.05, cameraAngleY + deltaY * 0.008));
                updateCameraPosition();

                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('mouseup', () => { isDragging = false; });

            window.addEventListener('keydown', (e) => {
                if (!gameActive) return;
                const isMoving = balls.some(b => b.velocity.length() > 0.01);
                if (isMoving) return;

                if (e.key === 'a' || e.key === 'ArrowLeft') {
                    aimAngle += 0.04;
                } else if (e.key === 'd' || e.key === 'ArrowRight') {
                    aimAngle -= 0.04;
                } else if (e.key === ' ' && !isCharging) {
                    isCharging = true;
                    power = 0;
                    document.getElementById('power-container').style.opacity = '1';
                } else if (e.key === 'r' || e.key === 'R') {
                    if (cueBall.sunk) {
                        cueBall.sunk = false;
                        cueBall.mesh.visible = true;
                        cueBall.position.set(0, 0, 4);
                        cueBall.velocity.set(0, 0, 0);
                        showNotification("CUE BALL RESET", "Place cue ball and take your shot.");
                    }
                }
            });

            window.addEventListener('keyup', (e) => {
                if (e.key === ' ' && isCharging) {
                    isCharging = false;
                    strikeBall();
                    document.getElementById('power-container').style.opacity = '0';
                }
            });

            document.getElementById('reset-btn').addEventListener('click', resetGame);
        }

        function updateCameraPosition() {
            camera.position.x = cueBall ? cueBall.mesh.position.x + cameraDistance * Math.sin(cameraAngleX) * Math.cos(cameraAngleY) : 0;
            camera.position.y = cueBall ? cueBall.mesh.position.y + cameraDistance * Math.sin(cameraAngleY) : 10;
            camera.position.z = cueBall ? cueBall.mesh.position.z + cameraDistance * Math.cos(cameraAngleX) * Math.cos(cameraAngleY) : 15;
            camera.lookAt(cueBall ? cueBall.mesh.position : new THREE.Vector3(0, 0, 0));
        }

        function strikeBall() {
            if (cueBall.sunk) return;
            const strikeDir = new THREE.Vector3(Math.sin(aimAngle), 0, Math.cos(aimAngle));
            cueBall.velocity.copy(strikeDir.multiplyScalar(power * 0.12));
            power = 0;
        }

        function resetGame() {
            balls.forEach(b => scene.remove(b.mesh));
            balls = [];
            score = 0;
            sunkCount = 0;
            document.getElementById('score-val').innerText = score;
            document.getElementById('sunk-val').innerText = `${sunkCount} / 15`;
            initBalls();
            if (cueBall) {
                cueBall.sunk = false;
                cueBall.mesh.visible = true;
                cueBall.position.set(0, 0, 4);
                cueBall.velocity.set(0, 0, 0);
            }
            showNotification("TABLE RESET", "New rack ready! Take your shot.");
        }

        function showNotification(title, text) {
            const box = document.getElementById('message-box');
            document.getElementById('msg-title').innerText = title;
            document.getElementById('msg-text').innerText = text;
            box.style.opacity = '1';
            box.style.transform = 'translate(-50%, -50%) scale(1)';
            setTimeout(() => {
                box.style.opacity = '0';
                box.style.transform = 'translate(-50%, -50%) scale(0.95)';
            }, 2500);
        }

        /* Main Game Loop & Physics Engine */
        function animate() {
            requestAnimationFrame(animate);

            // Power Charging Logic
            if (isCharging) {
                power = Math.min(maxPower, power + 0.8);
                const pct = (power / maxPower) * 100;
                document.getElementById('power-bar').style.width = `${pct}%`;
                document.getElementById('power-val').innerText = `${Math.round(pct)}%`;
            }

            // Physics Update for Balls
            let allStopped = true;

            balls.forEach(b => {
                if (b.sunk) return;

                if (b.velocity.length() > 0.005) {
                    allStopped = false;
                    b.mesh.position.add(b.velocity);
                    b.velocity.multiplyScalar(FRICTION);

                    // Ball rotation simulation based on velocity
                    const speed = b.velocity.length();
                    const rotAxis = new THREE.Vector3(-b.velocity.z, 0, b.velocity.x).normalize();
                    b.mesh.rotateOnWorldAxis(rotAxis, speed / b.radius);

                    // Cushion Collisions
                    const halfW = TABLE_WIDTH / 2 - b.radius;
                    const halfL = TABLE_LENGTH / 2 - b.radius;

                    if (b.mesh.position.x < -halfW) {
                        b.mesh.position.x = -halfW;
                        b.velocity.x *= -CUSHION_RESTITUTION;
                    } else if (b.mesh.position.x > halfW) {
                        b.mesh.position.x = halfW;
                        b.velocity.x *= -CUSHION_RESTITUTION;
                    }

                    if (b.mesh.position.z < -halfL) {
                        b.mesh.position.z = -halfL;
                        b.velocity.z *= -CUSHION_RESTITUTION;
                    } else if (b.mesh.position.z > halfL) {
                        b.mesh.position.z = halfL;
                        b.velocity.z *= -CUSHION_RESTITUTION;
                    }

                    // Pocket Collision Detection
                    pockets.forEach(p => {
                        const dist = Math.hypot(b.mesh.position.x - p.x, b.mesh.position.z - p.z);
                        if (dist < p.radius) {
                            b.sunk = true;
                            b.mesh.visible = false;
                            b.velocity.set(0, 0, 0);

                            if (b.id === 0) {
                                showNotification("SCRATCH!", "Cue ball sunk! Press R to reset.");
                            } else {
                                sunkCount++;
                                score += b.id * 10;
                                document.getElementById('score-val').innerText = score;
                                document.getElementById('sunk-val').innerText =`${sunkCount} / 15`;
                                if (sunkCount === 15) {
                                    showNotification("VICTORY!", "All balls cleared! Excellent game.");
                                }
                            }
                        }
                    });
                } else {
                    b.velocity.set(0, 0, 0);
                }
            });

            // Ball-to-Ball Elastic Collisions
            for (let i = 0; i < balls.length; i++) {
                for (let j = i + 1; j < balls.length; j++) {
                    const b1 = balls[i];
                    const b2 = balls[j];
                    if (b1.sunk || b2.sunk) continue;

                    const dir = new THREE.Vector3().subVectors(b2.mesh.position, b1.mesh.position);
                    const dist = dir.length();
                    const minDist = b1.radius + b2.radius;

                    if (dist < minDist) {
                        dir.normalize();
                        const overlap = minDist - dist;
                        b1.mesh.position.addScaledVector(dir, -overlap * 0.5);
                        b2.mesh.position.addScaledVector(dir, overlap * 0.5);

                        const v1 = b1.velocity.dot(dir);
                        const v2 = b2.velocity.dot(dir);

                        const m1 = 1;
                        const m2 = 1;

                        const newV1 = (v1 * (m1 - m2) + 2 * m2 * v2) / (m1 + m2);
                        const newV2 = (v2 * (m2 - m1) + 2 * m1 * v1) / (m1 + m2);

                        b1.velocity.addScaledVector(dir, newV1 - v1);
                        b2.velocity.addScaledVector(dir, newV2 - v2);

                        b1.velocity.multiplyScalar(BALL_RESTITUTION);
                        b2.velocity.multiplyScalar(BALL_RESTITUTION);
                    }
                }
            }

            // Cue Stick Positioning & Aiming Indicator
            if (cueBall && !cueBall.sunk && allStopped) {
                cueStick.visible = true;
                const distanceBehind = 2.5 + (isCharging ? power * 0.08 : 0);
                cueStick.position.set(
                    cueBall.mesh.position.x - Math.sin(aimAngle) * distanceBehind,
                    cueBall.mesh.position.y + 0.2,
                    cueBall.mesh.position.z - Math.cos(aimAngle) * distanceBehind
                );
                cueStick.rotation.y = aimAngle;
                updateCameraPosition();
            } else {
                cueStick.visible = false;
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = init;
    </script>
</body>
</html>
