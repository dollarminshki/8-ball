<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBJ Pool Game</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #info {
            position: absolute; top: 20px; left: 20px; color: white;
            background: rgba(0,0,0,0.7); padding: 10px; border-radius: 5px;
            pointer-events: none; z-index: 100;
        }
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; font-size: 24px; z-index: 200;
        }
    </style>
</head>
<body>
    <div id="info">Click and drag to aim. Release to shoot.</div>
    <div id="loading">Loading OBJ Table...</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "@dimforge/rapier3d-compat": "https://cdn.skypack.dev/@dimforge/rapier3d-compat@0.11.2"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
        import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';
        import RAPIER from '@dimforge/rapier3d-compat';

        // --- 1. INITIALIZATION ---
        await RAPIER.init();

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111122);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2.5, 3);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 0, 0);

        // Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 5);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- 2. PHYSICS WORLD ---
        const world = new RAPIER.World({ x: 0, y: -9.81, z: 0 });

        // --- 3. LOAD YOUR OBJ TABLE ---
        // Place table.obj (and optionally table.mtl + textures) in the same folder.
        const objLoader = new OBJLoader();
        const mtlLoader = new MTLLoader();

        // If you have an .mtl file, load it first. Otherwise skip to the else branch.
        const HAS_MTL = true; // <-- set to false if you have no .mtl file

        const onModelLoaded = (object) => {
            document.getElementById('loading').style.display = 'none';

            // Scale + position - ADJUST THESE FOR YOUR TABLE
            object.scale.set(0.01, 0.01, 0.01);
            object.position.set(0, 0, 0);

            object.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                    // If OBJ has no materials, give it a default wood look
                    if (!child.material || (Array.isArray(child.material) && child.material.length === 0)) {
                        child.material = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
                    }
                }
            });

            scene.add(object);

            // Debug helper - shows the bounding box. Remove once dimensions look right.
            const box = new THREE.Box3().setFromObject(object);
            console.log('Table bounding box:', box);
            scene.add(new THREE.Box3Helper(box, 0xffff00));

            createTableColliders();
        };

        if (HAS_MTL) {
            mtlLoader.load('./table.mtl', (materials) => {
                materials.preload();
                objLoader.setMaterials(materials);
                objLoader.load('./table.obj', onModelLoaded, undefined, (err) => {
                    console.error('OBJ load error:', err);
                    document.getElementById('loading').innerText = 'Failed to load OBJ. Check console.';
                });
            }, undefined, () => {
                // MTL failed - try OBJ alone
                console.warn('MTL failed, loading OBJ without materials');
                objLoader.load('./table.obj', onModelLoaded, undefined, (err) => {
                    console.error('OBJ load error:', err);
                    document.getElementById('loading').innerText = 'Failed to load OBJ. Check console.';
                });
            });
        } else {
            objLoader.load('./table.obj', onModelLoaded, undefined, (err) => {
                console.error('OBJ load error:', err);
                document.getElementById('loading').innerText = 'Failed to load OBJ. Check console.';
            });
        }

        // --- 4. TABLE PHYSICS COLLIDERS (INVISIBLE) ---
        function createTableColliders() {
            const bedWidth = 2.0;   // ADJUST to match your table
            const bedLength = 4.0;  // ADJUST to match your table
            const bedThickness = 0.1;

            // Bed
            const bedBody = world.createRigidBody(
                RAPIER.RigidBodyDesc.fixed().setTranslation(0, 0, 0)
            );
            world.createCollider(
                RAPIER.ColliderDesc.cuboid(bedWidth / 2, bedThickness / 2, bedLength / 2),
                bedBody
            );

            // Cushions
            const cushionHeight = 0.15;
            const cushionThickness = 0.1;
            const y = bedThickness / 2 + cushionHeight / 2;

            for (const z of [-bedLength / 2 - cushionThickness / 2, bedLength / 2 + cushionThickness / 2]) {
                const body = world.createRigidBody(
                    RAPIER.RigidBodyDesc.fixed().setTranslation(0, y, z)
                );
                world.createCollider(
                    RAPIER.ColliderDesc.cuboid(bedWidth / 2 + cushionThickness, cushionHeight / 2, cushionThickness / 2),
                    body
                );
            }
            for (const x of [-bedWidth / 2 - cushionThickness / 2, bedWidth / 2 + cushionThickness / 2]) {
                const body = world.createRigidBody(
                    RAPIER.RigidBodyDesc.fixed().setTranslation(x, y, 0)
                );
                world.createCollider(
                    RAPIER.ColliderDesc.cuboid(cushionThickness / 2, cushionHeight / 2, bedLength / 2),
                    body
                );
            }
        }

        // --- 5. BALLS ---
        const balls = [];
        const ballRadius = 0.028;

        function createBall(position, color) {
            const mesh = new THREE.Mesh(
                new THREE.SphereGeometry(ballRadius, 32, 32),
                new THREE.MeshStandardMaterial({ color })
            );
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);

            const body = world.createRigidBody(
                RAPIER.RigidBodyDesc.dynamic()
                    .setTranslation(position.x, position.y, position.z)
                    .setLinearDamping(0.5)
                    .setAngularDamping(0.8)
                    .setCcdEnabled(true)
            );
            world.createCollider(
                RAPIER.ColliderDesc.ball(ballRadius)
                    .setRestitution(0.9)
                    .setFriction(0.1),
                body
            );

            const ball = { mesh, body };
            balls.push(ball);
            return ball;
        }

        const cueBall = createBall(new THREE.Vector3(0, 0.2, 1.5), 0xffffff);
        createBall(new THREE.Vector3(0.2, 0.2, 0), 0xff0000);
        createBall(new THREE.Vector3(-0.2, 0.2, 0), 0x0000ff);
        createBall(new THREE.Vector3(0, 0.2, -1), 0x00ff00);

        // --- 6. SHOOTING ---
        let isAiming = false;
        let aimStart = new THREE.Vector2();

        renderer.domElement.addEventListener('mousedown', (e) => {
            if (isBallMoving()) return;
            isAiming = true;
            aimStart.set(e.clientX, e.clientY);
        });

        renderer.domElement.addEventListener('mouseup', (e) => {
            if (!isAiming) return;
            isAiming = false;

            const dx = e.clientX - aimStart.x;
            const dy = e.clientY - aimStart.y;
            const length = Math.hypot(dx, dy);
            if (length < 10) return;

            const strength = Math.min(length * 0.0005, 0.1);
            cueBall.body.applyImpulse(
                { x: (dx / length) * strength, y: 0, z: (dy / length) * strength },
                true
            );
        });

        function isBallMoving() {
            return balls.some((b) => {
                const v = b.body.linvel();
                return Math.hypot(v.x, v.y, v.z) > 0.1;
            });
        }

        // --- 7. LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            world.step();
            for (const b of balls) {
                const p = b.body.translation();
                const r = b.body.rotation();
                b.mesh.position.set(p.x, p.y, p.z);
                b.mesh.quaternion.set(r.x, r.y, r.z, r.w);
            }
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
